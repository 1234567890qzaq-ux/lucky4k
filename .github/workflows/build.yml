name: Build APK

on:
  workflow_dispatch:
    inputs:
      step:
        description: "1-unpack (birinchi marta) yoki 2-build (APK yig'ish)"
        type: choice
        options: ["1-unpack", "2-build"]
        default: "1-unpack"

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ inputs.step == '1-unpack' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project into repo root
        run: |
          unzip -q lucky-4k-ai.zip
          cp -r lucky-4k-ai/. .
          rm -rf lucky-4k-ai lucky-4k-ai.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project"
          git push

  build:
    if: ${{ inputs.step == '2-build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check backend URL secret
        run: test -n "$EXPO_PUBLIC_API_URL" || (echo "API_URL secret is empty" && exit 1)
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix -- --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK (arm64 = Redmi Note 8 Pro)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Lucky4K-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lucky4K-AI-apk
          path: Lucky4K-AI.apk
      - name: Publish as Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: LUCKY 4K AI build ${{ github.run_number }}
          files: Lucky4K-AI.apk
